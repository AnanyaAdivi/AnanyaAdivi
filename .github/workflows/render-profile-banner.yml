name: Render animated profile banner

on:
  push:
    branches: [main]
    paths:
      - "assets/generate_profile_banner.py"
      - "assets/profile-banner.svg"
      - ".github/workflows/render-profile-banner.yml"

permissions:
  contents: write

jobs:
  render-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow cairosvg

      - name: Render animated GIF
        run: python assets/generate_profile_banner.py

      - name: Commit generated banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-banner.gif
          if git diff --cached --quiet; then
            echo "Banner is already up to date."
            exit 0
          fi
          git commit -m "Generate animated profile banner"
          git push
