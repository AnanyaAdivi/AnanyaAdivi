    <circle cx="1055" cy="228" r="42" stroke-opacity=".2"/>
  </g>
  <g fill="#9CE8E8">
    <circle cx="830" cy="78" r="4"/><circle cx="930" cy="132" r="5"/>
    <circle cx="1048" cy="70" r="4"/><circle cx="1132" cy="132" r="4"/>
    <circle cx="1055" cy="228" r="5"/><circle cx="930" cy="196" r="3.5"/>
