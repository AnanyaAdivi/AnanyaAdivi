  <g>
    <text x="78" y="82" fill="#9CE8E8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="4">COMPUTER SCIENCE  /  DATA SCIENCE &amp; AI</text>
    <text x="72" y="170" fill="#F0F7F8" font-family="Impact, 'Arial Black', 'Trebuchet MS', sans-serif" font-size="76" font-weight="900" letter-spacing="2">ANANYA ADIVI</text>
    <rect x="80" y="193" width="112" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="239" fill="#C5D7DD" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" letter-spacing=".35">Research-minded. Evidence-driven. Building intelligent systems.</text>
    <text x="80" y="282" fill="#79C9D1" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.7">DATA SCIENCE   ·   MACHINE LEARNING   ·   RELIABLE AI</text>
