<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ananya Adivi — Data Science and AI</title>
  <desc id="desc">A midnight charcoal research banner with ice-blue and teal accents, bold condensed display typography, and a geometric neural-network motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1118"/>
      <stop offset="55%" stop-color="#13232D"/>
      <stop offset="100%" stop-color="#173D46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67C9D2"/>
      <stop offset="100%" stop-color="#B5F0EA"/>
