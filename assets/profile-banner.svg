  <circle cx="1010" cy="142" r="245" fill="url(#glow)"/>
  <path d="M0 286H1200" stroke="#76D5DB" stroke-opacity=".28"/>
  <path d="M0 18H1200" stroke="#D7F5F2" stroke-opacity=".12"/>
  <g fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity=".62">
    <path d="M830 78L930 132L1048 70L1132 132L1055 228L930 196L830 246L760 170Z"/>
    <path d="M930 132L930 196M1048 70L1055 228M830 78L830 246M1132 132L1055 228"/>
